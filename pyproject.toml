[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-augmented-medical-calculation"
version = "0.1.0"
description = "Tool-augmented LLM framework for reliable medical calculation from patient notes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0 AND CC-BY-SA-4.0; see NOTICE.md"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.111,<1",
  "requests>=2.31,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
retrieval = [
  "numpy>=1.26,<3",
  "sentence-transformers>=2.7,<6",
  "transformers>=4.44,<6",
]
local = [
  "vllm>=0.5",
]

[project.scripts]
toolmed-run = "toolmed_agent.pipeline:main"
toolmed-tools-api = "toolmed_agent.tool_api:main"
toolmed-build-tools = "toolmed_agent.tool_builder.run_api:main"
toolmed-build-tools-no-web = "toolmed_agent.tool_builder.run_api_no_web:main"

[tool.setuptools.packages.find]
where = ["src"]
