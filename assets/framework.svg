<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Tool-augmented medical calculation workflow</title>
  <desc id="desc">A patient note is converted to structured parameters, while calculator rules are converted to a validated tool. Both feed deterministic execution and an auditable answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .heading { font: 700 25px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 16px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" class="heading">Tool-Augmented Medical Calculation</text>

  <rect x="45" y="105" width="205" height="105" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="147" y="145" text-anchor="middle" class="label">Patient note</text>
  <text x="147" y="176" text-anchor="middle" class="body">Clinical narrative</text>

  <rect x="335" y="90" width="250" height="135" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="132" text-anchor="middle" class="label">Parameter extraction</text>
  <text x="460" y="164" text-anchor="middle" class="body">Calculator-specific schema</text>
  <text x="460" y="190" text-anchor="middle" class="small">+ three same-calculator examples</text>

  <rect x="675" y="105" width="205" height="105" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="777" y="145" text-anchor="middle" class="label">Parameters</text>
  <text x="777" y="176" text-anchor="middle" class="body">Structured JSON</text>

  <path d="M250 157 L335 157" class="arrow"/>
  <path d="M585 157 L675 157" class="arrow"/>

  <rect x="45" y="320" width="205" height="105" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="147" y="360" text-anchor="middle" class="label">Calculator rules</text>
  <text x="147" y="391" text-anchor="middle" class="body">Formula and constraints</text>

  <rect x="335" y="305" width="250" height="135" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="347" text-anchor="middle" class="label">Tool development</text>
  <text x="460" y="379" text-anchor="middle" class="body">Synthesis, execution tests,</text>
  <text x="460" y="405" text-anchor="middle" class="body">and iterative repair</text>

  <rect x="675" y="320" width="205" height="105" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="777" y="360" text-anchor="middle" class="label">Validated tool</text>
  <text x="777" y="391" text-anchor="middle" class="body">Reusable Python function</text>

  <path d="M250 372 L335 372" class="arrow"/>
  <path d="M585 372 L675 372" class="arrow"/>

  <rect x="960" y="190" width="205" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1062" y="235" text-anchor="middle" class="label">Deterministic</text>
  <text x="1062" y="264" text-anchor="middle" class="label">execution</text>
  <text x="1062" y="299" text-anchor="middle" class="body">Answer + audit trail</text>

  <path d="M880 157 C925 157, 915 225, 960 235" class="arrow"/>
  <path d="M880 372 C925 372, 915 305, 960 295" class="arrow"/>

  <path d="M460 225 L460 305" class="arrow dashed"/>
  <text x="475" y="271" class="small">feedback</text>
</svg>
